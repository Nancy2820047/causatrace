name: Offline smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install benchmark dependency
        run: python -m pip install -r requirements-benchmark.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  docker-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and start the offline dashboard
        run: docker compose up --build --detach
      - name: Check the dashboard and both export formats
        run: |
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/api/incidents/demo-002 | grep NEEDS_INVESTIGATION
          curl --fail http://127.0.0.1:8000/api/incidents/demo-002.md | grep NEEDS_INVESTIGATION
      - name: Remove the test container
        if: always()
        run: docker compose down
